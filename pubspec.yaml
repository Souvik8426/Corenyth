name: assistant
description: Local-first offline voice/text assistant with tasks, reminders and memory.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  crypto: ^3.0.7 # already resolved transitively; model SHA-256 check
  flutter_markdown_plus: ^1.0.12
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.3
flutter:
  uses-material-design: true
  assets:
    - branding/corenyth-logo.png
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: false
  image_path: branding/corenyth-logo.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: branding/corenyth-logo.png
  adaptive_icon_foreground_inset: 20
  min_sdk_android: 24

hooks:
  user_defines:
    sqlite3:
      source:
        macos: system
        default: sqlite3
