name: assistant
description: Local-first offline voice/text assistant with tasks, reminders and memory.
publish_to: none
version: 0.2.0+2
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  crypto: ^3.0.7 # already resolved transitively; model SHA-256 check
  flutter_markdown_plus: ^1.0.12
  archive: ^4.5.2
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.3
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/corenyth-logo-primary.png
  adaptive_icon_background: assets/branding/corenyth-logo-primary.png
  adaptive_icon_foreground: assets/branding/corenyth-logo-primary.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 24

# Host test builds of package:sqlite3 (a dev-only dependency through
# sqflite_common_ffi) link the operating system's SQLite, which ships the FTS4
# module the app's schema relies on. The precompiled binaries the package
# downloads by default compile FTS5 only, which made fresh-create and memory
# retrieval tests fail on the host with "no such module: fts4". Android itself
# is unaffected: the app talks to the platform SQLite through sqflite, never
# through this package, so no build hook runs for the shipped app.
hooks:
  user_defines:
    sqlite3:
      source: system
